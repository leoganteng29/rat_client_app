name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v2
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      - name: Create Flutter Project Structure
        run: |
          flutter create temp_app
          cp -r temp_app/android ./
          cp -r temp_app/ios ./
          cp temp_app/pubspec.lock ./ || true
          rm -rf temp_app

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4   # <--- INI YANG DIUBAH JADI v4
        with:
          name: rat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
