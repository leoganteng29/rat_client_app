name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      # TRIK: Menggunakan template V2 dari komunitas
      - name: Use Flutter V2 Template
        uses: Ashley-Alvares/flutter_v2_template@v1

      - name: Overwrite Main Dart
        run: cp lib/main.dart lib/main.dart

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
